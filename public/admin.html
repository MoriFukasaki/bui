<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản trị video · Camroom</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a href="/" class="brand">◉ camroom</a><span>Quản trị video</span></header><main>
<section class="record-history" id="admin-login"><p class="eyebrow">KHO VIDEO RIÊNG</p><h1>Đăng nhập quản trị</h1>
<form id="login-form"><label>Tài khoản<input id="username" required maxlength="100" autocomplete="username"></label><label>Mật khẩu<input id="password" type="password" required maxlength="256" autocomplete="current-password"></label><button class="primary" type="submit">Đăng nhập</button></form></section>
<section id="admin-library" hidden><div class="studio-head"><div><p class="eyebrow" id="admin-identity"></p><h1>Thư viện video</h1></div><button id="logout" class="secondary">Đăng xuất</button></div>
<form id="filter-form" class="config-fields"><label>Mã phòng<input id="filter-room" maxlength="12" placeholder="Để trống để xem tất cả"></label><label>Trạng thái<select id="filter-state"><option value="">Tất cả</option><option value="uploaded">Đã lưu Neon</option><option value="capture-failed">Lỗi ghi trên thiết bị</option><option value="upload-failed">Lỗi tải lên</option><option value="receiving">Đang nhận dữ liệu</option><option value="uploading">Đang lưu Neon</option><option value="scheduled">Đã tạo lượt quay</option></select></label><button class="secondary" type="submit">Lọc / Làm mới</button></form>
<p class="hint">Video từ mọi phòng, kể cả phòng đã đóng. Tải file gốc của từng máy; không nén lại. Link tải riêng có hiệu lực 5 phút.</p>
<div id="admin-videos" class="record-history"></div><button id="load-more" class="secondary" hidden>Xem thêm</button></section>
<p id="admin-message" role="status" aria-live="polite"></p></main><script type="module" src="/admin.js"></script></body></html>
