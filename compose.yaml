services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      PORT: 3000
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      ICE_TRANSPORT_POLICY: ${ICE_TRANSPORT_POLICY:-all}
      RECORDING_DIR: /app/data/recordings
    volumes:
      - recording_data:/app/data
    expose:
      - "3000"
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  recording_data:
  caddy_data:
  caddy_config:
